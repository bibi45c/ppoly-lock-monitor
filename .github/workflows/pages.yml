name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # lock-monitor 快照：每 30 分钟重建一次（页面本身实时读链，快照只用于首屏和历史曲线）；GitHub 定时任务可能延迟
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site
        run: node scripts/build.mjs
      - name: pPOLY lock snapshot
        run: node scripts/lock-snapshot.mjs _site/lock-monitor/snapshot.json
        continue-on-error: true
        timeout-minutes: 5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
